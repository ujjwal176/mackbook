<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign — SponsorMySetup</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">Sponsor<span>MySetup</span></a>
    <div class="nav-links">
      <a class="active" href="campaigns.html">Campaigns</a>
      <a href="index.html#how-it-works">How it works</a>
      <a class="nav-btn" href="create.html">Create Campaign</a>
    </div>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </nav>

  <main class="page" id="campaignPage"></main>

  <!-- Sponsor Modal -->
  <div id="sponsorModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">×</button>
      <p class="eyebrow">SPONSOR THIS CAMPAIGN</p>
      <h2 id="modalTitle">Sponsor a spot</h2>
      <p>Choose a spot, enter your brand details and proceed to Stripe Payment.</p>
      <form onsubmit="reserveSpot(event)">
        <label>Brand name<input id="brandName" required placeholder="Acme Inc."></label>
        <label>Website<input id="brandWebsite" type="url" required placeholder="https://example.com"></label>
        <label>Email<input id="brandEmail" type="email" required placeholder="you@company.com"></label>
        <button class="btn btn-primary full" type="submit">Pay with Stripe</button>
      </form>
    </div>
  </div>

  <!-- PS5 Visual Overlay Section -->
  <div class="sponsor-container">
    <img src="ps5-device.png" alt="PS5 Console" class="ps5-bg" />

    <!-- Dynamic Sponsor Slots -->
    <div class="slot slot-1" onclick="openModal(1)">
      <img id="logo-1" src="sponsor1-logo.png" alt="Sponsor 1" />
    </div>
    <div class="slot slot-2" onclick="openModal(2)">
      <img id="logo-2" src="sponsor2-logo.png" alt="Sponsor 2" />
    </div>
    <div class="slot slot-3" onclick="openModal(3)">
      <img id="logo-3" src="sponsor3-logo.png" alt="Sponsor 3" />
    </div>
    <div class="slot slot-4" onclick="openModal(4)">
      <img id="logo-4" src="sponsor4-logo.png" alt="Sponsor 4" />
    </div>
  </div>

  <footer>
    <div><strong>SponsorMySetup</strong><p>Turning ambitious projects into sponsored projects.</p></div>
  </footer>

  <!-- Required External SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</body>
</html>
