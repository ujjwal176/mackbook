<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SponsorMySetup</title>
  <style>
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
    }
    .logo span { color: #3b82f6; }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .stat-box {
      background: #27272a;
      padding: 15px;
      border-radius: 8px;
      flex: 1;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="index.html">Sponsor<span>MySetup</span></a>
  <div>
    <a href="login.html" style="color: #a1a1aa; text-decoration: none;">Logout</a>
  </div>
</nav>

<div class="container">
  <h1>Creator Dashboard</h1>
  <p id="userGreeting" style="color: #a1a1aa;">Welcome back!</p>

  <div class="card">
    <h2>Campaign Overview</h2>
    <div class="stats">
      <div class="stat-box">
        <small style="color: #a1a1aa;">Total Raised</small>
        <h3 style="margin: 5px 0 0 0; font-size: 1.5rem; color: #10b981;">$1,000</h3>
      </div>
      <div class="stat-box">
        <small style="color: #a1a1aa;">Spots Sold</small>
        <h3 style="margin: 5px 0 0 0; font-size: 1.5rem;">4</h3>
      </div>
      <div class="stat-box">
        <small style="color: #a1a1aa;">Platform Fee</small>
        <h3 style="margin: 5px 0 0 0; font-size: 1.5rem;">$70.00</h3>
      </div>
    </div>
  </div>
</div>

<script>
  // Safe internal script - no external file dependency
  var savedEmail = localStorage.getItem('user_email');
  if (savedEmail) {
    document.getElementById('userGreeting').innerText = 'Welcome back, ' + savedEmail;
  }
</script>
</body>
</html>
